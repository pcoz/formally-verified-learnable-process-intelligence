# Coloured-token credit approval — tokens at p_submitted carry the
# application amount; the approve / decline guards route on it.
#
# Showcases the Phase 9 coloured-Petri-net feature: the routing
# decision depends on the *value* of the token (the application
# amount), not just on its presence. In the pre-CPN substrate the
# closest you could do was encode the amount as a place activation
# and rely on the learned XOR routing — workable but lossy. With
# coloured tokens the amount travels structurally and the guards
# express the decision rule declaratively.
#
# Flow:
#   p_submitted (token value = amount)
#       -- t_approve [guard: amount >= 1000] --> p_approved
#       -- t_decline [guard: amount <  1000] --> p_declined
#
# Each token represents one credit application; its value IS the
# amount in monetary units.

[scenario]
name = "credit_approval_coloured"
description = "Credit applications routed on token value via Phase 9 coloured-Petri-net guards."

[net]
source = "inline"

[[net.places]]
id = "p_submitted"
label = "application submitted"
[[net.places]]
id = "p_approved"
label = "application approved"
[[net.places]]
id = "p_declined"
label = "application declined"

[[net.transitions]]
id = "t_approve"
label = "approve loan"
guard = { place = "p_submitted", op = ">=", value = 1000.0 }

[[net.transitions]]
id = "t_decline"
label = "decline loan"
guard = { place = "p_submitted", op = "<", value = 1000.0 }

[[net.arcs]]
src = "p_submitted"
dst = "t_approve"
[[net.arcs]]
src = "t_approve"
dst = "p_approved"

[[net.arcs]]
src = "p_submitted"
dst = "t_decline"
[[net.arcs]]
src = "t_decline"
dst = "p_declined"

# Inline training traces: a mix of high- and low-amount loan
# applications. Each trace's `amount` attribute drives both the
# input marking (a token at p_submitted) and the value channel
# read by the compiled guards. The structural guards declared
# above (>= 1000 for approve, < 1000 for decline) seed the
# learnable thresholds; training refines them against the
# observed routing in these traces.

[traces]
source = "inline"

[[traces.inline]]
attributes = { amount = "5000" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "12000" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "2500" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "8000" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "3200" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "1500" }
events = ["approve loan"]
[[traces.inline]]
attributes = { amount = "200" }
events = ["decline loan"]
[[traces.inline]]
attributes = { amount = "750" }
events = ["decline loan"]
[[traces.inline]]
attributes = { amount = "400" }
events = ["decline loan"]
[[traces.inline]]
attributes = { amount = "900" }
events = ["decline loan"]
[[traces.inline]]
attributes = { amount = "150" }
events = ["decline loan"]
[[traces.inline]]
attributes = { amount = "600" }
events = ["decline loan"]

[training]
steps = 800
lr = 0.5
sharpness = 1.0
seed = 0

# Every application starts as one token at p_submitted; the
# `amount` attribute fixes the value carried by that token.
[training.input_marking]
p_submitted = { constant = 1.0 }

[training.input_values]
p_submitted = { attribute = "amount" }
