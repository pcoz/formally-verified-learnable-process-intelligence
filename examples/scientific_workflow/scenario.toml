events = ["denature DNA", "anneal primers", "extend DNA", "measure amplification", "accept sample"]
[[traces.inline]]
attributes = { amplification_quality = "0.68" }
events = ["denature DNA", "anneal primers", "extend DNA", "measure amplification", "accept sample"]
[[traces.inline]]
attributes = { amplification_quality = "0.83" }
