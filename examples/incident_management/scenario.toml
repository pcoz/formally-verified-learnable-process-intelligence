# BPI Challenge 2013 — Volvo IT incident management.
#
# PETRA running on REAL public data. The trace log here is the
# actual XES file published with the BPI Challenge 2013 dataset
# (Steeman 2014); it carries 7,554 real incident tickets handled
# inside Volvo IT, each one a sequence of lifecycle states drawn
# from the ITIL incident workflow.
#
# Source: https://data.4tu.nl/articles/dataset/_/12693914
# Citation: Steeman, W. (2014). BPI Challenge 2013, incidents.
#   4TU.ResearchData. https://doi.org/10.4121/uuid:500573e6-accc-4b0c-9576-aa5468b10cee
#
# The compressed XES file is ~1.3 MB committed to the repo. The
# adapter reads gzipped XES transparently. To run on the full
# 7,554-trace log instead of the 300-trace sample, drop the
# `limit_traces` line.
#
# The structural net here is a deliberate simplification of the
# real process: incidents go through an In-Progress → Resolved →
# Closed canonical path. The real log shows the messy back-and-
# forth between In-Progress and Awaiting-Assignment that's
# characteristic of real ITIL workflows; the simplified net is
# what PETRA's training pipeline learns to fit *to*. Trace events
# that don't appear in our net's transition labels are simply
# unmapped — the framework handles that gracefully (the
# occurrence vector just ignores unknown events).

[scenario]
name = "bpi_2013_incidents"
description = "BPI Challenge 2013 Volvo IT incident management — real public XES log, structural prior fitted to the canonical ITIL incident lifecycle."

[net]
source = "inline"

[[net.places]]
id = "p_opened"
tokens = 1
label = "incident opened"
[[net.places]]
id = "p_in_progress"
label = "incident in progress"
[[net.places]]
id = "p_resolved"
label = "incident resolved"
[[net.places]]
id = "p_closed"
label = "incident closed"

[[net.transitions]]
id = "t_in_progress"
label = "In Progress"
[[net.transitions]]
id = "t_resolved"
label = "Resolved"
[[net.transitions]]
id = "t_closed"
label = "Closed"

[[net.arcs]]
src = "p_opened"
dst = "t_in_progress"
[[net.arcs]]
src = "t_in_progress"
dst = "p_in_progress"

[[net.arcs]]
src = "p_in_progress"
dst = "t_resolved"
[[net.arcs]]
src = "t_resolved"
dst = "p_resolved"

[[net.arcs]]
src = "p_resolved"
dst = "t_closed"
[[net.arcs]]
src = "t_closed"
dst = "p_closed"

[traces]
source = "xes_file"
path = "data/incidents.xes.gz"
# Full 7,554-trace BPI 2013 corpus — the entire public release,
# unedited. The adapter reads the 1.3 MB gzipped XES file directly.
# The BPI 2013 dataset records `impact` (Low / Medium / High /
# Major) at the event level. Promote it to trace-level so the
# trainer can read it as a per-trace routing attribute.
promote_event_attrs = ["impact"]
# BPI 2013 uses concept:name only for four high-level activity
# tags (Accepted / Queued / Completed / Unmatched); the
# meaningful state names live in `lifecycle:transition`
# (In Progress, Resolved, Closed, Wait, Assigned, etc.). Override
# the event-name source so the structural net's transition labels
# match the lifecycle states people actually look at.
event_name_attr = "lifecycle:transition"

[training.input_marking]
# Impact label values aren't numeric in the source data ("Low",
# "Medium", "High", "Major"), so we map them onto a fixed bucket
# value below at scenario-execution time via a Python wrapper
# around `attribute_to_marking`. The adapter's default float()
# parse won't work directly on these labels; the test for this
# scenario calls train_on_traces with a custom mapping function
# rather than the default `ctx.attribute_to_marking`.
# Placeholder constant — the test supplies the real mapping:
p_opened = { constant = 0.5 }

[training]
steps = 600
lr = 0.1
sharpness = 1.0
firing = "sigmoid"
routing = "independent"
num_steps = 0
seed = 0

[interpretability]
extract_xor_rules = false
extract_and_join_rules = false
