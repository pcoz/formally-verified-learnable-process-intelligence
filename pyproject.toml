# PEP 517 / 518 / 621 build configuration for PETRA.
#
# Distribution name on PyPI is "petra-nn"; the importable Python
# package is "petri_net_nn" (matches the directory layout). The
# bare "petra" name was already reserved on PyPI when this package
# was registered, so the distribution adopted the hyphenated form
# instead. Version is read dynamically from
# petri_net_nn.__version__ so there is one source of truth.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petra-nn"
dynamic = ["version"]
description = "Petri-Net Trained Architecture — formally-verified learnable process intelligence"
readme = "README.md"
authors = [
    { name = "Edward Chalk", email = "edward@fleetingswallow.com" },
]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "petri-net",
    "process-mining",
    "bpmn",
    "neural-network",
    "interpretable-ml",
    "formal-verification",
    "bisimulation",
    "anomaly-detection",
    "workflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # torch supplies tensors, autograd, and nn.Module — the
    # entire compiler / training / sensitivity machinery is built
    # on it. 2.0 is the modern baseline; nothing in PETRA needs
    # newer than that.
    "torch>=2.0",
]

[project.optional-dependencies]
# Development extras — install with: pip install petra-nn[dev]
dev = [
    "pytest>=7",
]
# Docs build extras — used by .github/workflows/docs.yml to
# build the MkDocs Material site. Install with:
#     pip install petra-nn[docs]
# (or, locally:  pip install -e ".[docs]"  and then  mkdocs serve)
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://fleetingswallow.com"
Repository = "https://github.com/pcoz/formally-verified-learnable-process-intelligence"
Documentation = "https://github.com/pcoz/formally-verified-learnable-process-intelligence#readme"
Changelog = "https://github.com/pcoz/formally-verified-learnable-process-intelligence/blob/main/CHANGELOG.md"

[tool.setuptools]
# Explicit package listing — keeps the wheel from accidentally
# vacuuming up examples/, docs/, tests/, session_notes/ etc.
packages = ["petri_net_nn"]
include-package-data = true

[tool.setuptools.dynamic]
# Single source of truth: petri_net_nn/__init__.py declares
# __version__ and setuptools reads it from there at build time.
version = { attr = "petri_net_nn.__version__" }
